[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foliothread"
version = "0.4.0"
description = "FolioThread — Long-document Translation Workspace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
  {name = "Xue Yang"}
]

[project.urls]
Homepage = "https://github.com/xueyang-dev/FolioThread"
Repository = "https://github.com/xueyang-dev/FolioThread"
Issues = "https://github.com/xueyang-dev/FolioThread/issues"

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
test = ["pytest>=8,<9"]

[project.scripts]
foliothread = "gui:main"
# Legacy v0.4 command; the public product command is `foliothread`.
transpraxis = "gui:main"

[tool.setuptools]
py-modules = ["app", "core", "gui"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["transpraxis*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
transpraxis = ["resources/*.txt", "resources/brand/*.svg", "resources/brand/*.png"]
